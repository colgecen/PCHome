name: Feature request
description: Suggest an idea for PChome
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the solution you'd like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you've considered.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - pchome-signal (signaling server)
        - pchome-desktop (Linux daemon)
        - pchome-mobile (Android app)
        - cross-cutting
    validations:
      required: true
