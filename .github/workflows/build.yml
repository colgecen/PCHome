name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  signal:
    name: Build Signal Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-signal
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release

  desktop:
    name: Build Desktop Daemon (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install clippy
        run: rustup component add clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release

  mobile:
    name: Build Mobile App (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        # Bkz. release.yml: setup-android@v3 çürük, hazır SDK kullanılıyor.
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
