name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  signal:
    name: Build Signal Server (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o bin/pchome-signal ./cmd/server
      - name: Test
        run: go test ./...

  desktop:
    name: Build Desktop Daemon (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install clippy
        run: rustup component add clippy
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test --release

  mobile:
    name: Build Mobile App (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pchome-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Grant execute permission
        run: chmod +x ./gradlew
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
