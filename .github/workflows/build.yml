name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-desktop-linux:
    name: Build Desktop (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd pchome-desktop
          cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pchome-desktop-linux
          path: pchome-desktop/target/release/pchome-desktop

  build-desktop-windows:
    name: Build Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: |
          cd pchome-desktop
          cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pchome-desktop-windows
          path: pchome-desktop/target/release/pchome-desktop.exe

  build-signal:
    name: Build Signal Server
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: pchome-signal-linux-amd64
          - goos: linux
            goarch: arm64
            name: pchome-signal-linux-arm64
          - goos: windows
            goarch: amd64
            name: pchome-signal-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            name: pchome-signal-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: pchome-signal-darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        working-directory: pchome-signal
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o /tmp/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: /tmp/${{ matrix.name }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 25.2.9519653

      - name: Install Gradle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle

      - name: Generate Gradle Wrapper
        run: |
          cd pchome-mobile
          gradle wrapper --gradle-version 8.2.0

      - name: Build APK
        run: |
          cd pchome-mobile
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pchome-mobile-apk
          path: pchome-mobile/app/build/outputs/apk/debug/app-debug.apk
