name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-desktop:
    name: Build Desktop
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: pchome-desktop-linux
            binary_name: pchome-desktop
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: pchome-desktop-windows
            binary_name: pchome-desktop.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cd pchome-desktop
          cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: pchome-desktop/target/${{ matrix.target }}/release/${{ matrix.binary_name }}

  build-signal:
    name: Build Signal Server
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: pchome-signal
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pchome-signal-linux-amd64
          path: pchome-signal/target/release/pchome-signal

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk: 25.2.9519653

      - name: Install Gradle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle

      - name: Generate Gradle Wrapper
        run: |
          cd pchome-mobile
          gradle wrapper --gradle-version 8.2.0

      - name: Build APK
        run: |
          cd pchome-mobile
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: pchome-mobile-apk
          path: pchome-mobile/app/build/outputs/apk/debug/app-debug.apk

  create-release:
    name: Create GitHub Release
    needs: [build-desktop, build-signal, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: List downloaded files
        run: find ./release-artifacts -type f

      - name: Generate changelog
        id: changelog
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo $(git rev-parse --short HEAD~1))..HEAD --oneline --no-merges > changelog.txt || echo "No changelog available" > changelog.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PChome ${{ github.ref_name }}
          body_path: changelog.txt
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: false

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.ref == 'refs/tags/*'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: pchome-signal
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            colgecen/pchome-signal:${{ steps.version.outputs.version }}
            colgecen/pchome-signal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
