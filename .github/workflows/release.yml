name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Desktop (tar.gz / AppImage / RPM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: PCHome-desktop
        run: cargo build --release

      - name: Stage payload
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p staging/AppDir/usr/bin staging/usr/bin
          install -m 755 PCHome-desktop/target/release/PCHome-desktop \
            staging/AppDir/usr/bin/PCHome-desktop
          install -m 644 PCHome-desktop/BUILD.md README.md staging/

          # .desktop entry + placeholder icon for the AppImage (base64 PNG,
          # no ImageMagick needed on the runner)
          cat > staging/AppDir/PCHome.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=PCHome
          Comment=Remote control your Linux PC from Android
          Exec=PCHome-desktop
          Icon=PCHome
          Categories=Network;RemoteAccess;
          EOF
          # appimagetool does not generate AppRun; ship our own launcher
          cat > staging/AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/PCHome-desktop" "$@"
          EOF
          chmod +x staging/AppDir/AppRun
          install -m 644 assets/icon.png staging/AppDir/PCHome.png

      - name: tar.gz
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp staging/AppDir/usr/bin/PCHome-desktop staging/usr/bin/
          tar -czf PCHome-desktop-${VERSION}-x86_64.tar.gz -C staging \
            usr/bin/PCHome-desktop BUILD.md README.md

      - name: AppImage
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          curl -fSL --retry 3 -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          [ "$(head -c4 appimagetool)" = $'\x7fELF' ] || { echo "appimagetool download failed"; exit 1; }
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run \
            staging/AppDir "PCHome-${VERSION}-x86_64.AppImage"

      - name: RPM
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER=${VERSION#v}
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SPECS,SOURCES}
          tar -czf ~/rpmbuild/SOURCES/PCHome-desktop-${VER}.tar.gz \
            -C staging usr/bin/PCHome-desktop
          cat > ~/rpmbuild/SPECS/PCHome-desktop.spec <<EOF
          Name:           PCHome-desktop
          Version:        ${VER}
          Release:        1%{?dist}
          Summary:        PCHome remote control desktop daemon
          License:        MIT
          Source0:        PCHome-desktop-${VER}.tar.gz
          Requires:       ffmpeg, pipewire
          %description
          Screen capture and input daemon for the PCHome remote control system.
          %prep
          %setup -c
          %install
          mkdir -p %{buildroot}%{_bindir}
          install -m 755 usr/bin/PCHome-desktop %{buildroot}%{_bindir}/PCHome-desktop
          %files
          %{_bindir}/PCHome-desktop
          EOF
          rpmbuild -bb ~/rpmbuild/SPECS/PCHome-desktop.spec
          find ~/rpmbuild/RPMS -name '*.rpm' -exec mv {} PCHome-desktop-${VER}-x86_64.rpm \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: |
            PCHome-desktop-*-x86_64.tar.gz
            PCHome-*-x86_64.AppImage
            PCHome-desktop-*.rpm

  build-signal:
    name: Signal server (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: PCHome-signal
        run: cargo build --release

      - name: Package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p staging
          install -m 755 PCHome-signal/target/release/PCHome-signal staging/
          install -m 644 PCHome-signal/README.md staging/
          tar -czf PCHome-signal-${VERSION}-x86_64.tar.gz -C staging PCHome-signal README.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signal-package
          path: PCHome-signal-*-x86_64.tar.gz

  build-android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        # android-actions/setup-android@v3 çürüdü: var olmayan "tools"
        # paketini kurdurup sdkmanager'ı patlatıyor. ubuntu-runner'da SDK
        # hazır kurulu geliyor; gereken platform doğrudan alınıyor.
        run: |
          set -x
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK=$SDK"
          SDM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDM" ] || SDM="$(command -v sdkmanager || true)"
          [ -n "$SDM" ] || { echo "sdkmanager bulunamadı:"; ls "$SDK" || true; exit 1; }
          echo "sdkmanager: $SDM"
          yes | "$SDM" --licenses > /dev/null || true
          "$SDM" --list_installed || true
          "$SDM" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build APK
        run: |
          cd PCHome-mobile
          # gradle-wrapper.jar (8.2) is committed, no local gradle needed
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd PCHome-mobile/app/build/outputs/apk/debug
          mv app-debug.apk PCHome-mobile-${VERSION}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: PCHome-mobile/app/build/outputs/apk/debug/PCHome-mobile-*.apk

  create-release:
    name: Create GitHub Release
    needs: [build-desktop, build-signal, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Flatten artifact layout
        run: |
          mkdir -p dist
          find ./release-artifacts -type f -exec mv {} dist/ \;
          ls -la dist/

      - name: Generate changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE="${PREV:+$PREV..}${GITHUB_REF_NAME}"
          { echo "## Changes"; git log ${RANGE} --oneline --no-merges | sed 's/^/- /'; } > changelog.md

      # Hafif güncelleme bildirimi: iki istemcideki OTA denetçiler ve
      # harici araçlar sürümü tek dosyadan okur (GitHub API kotasız).
      - name: Generate latest.json
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          APPIMAGE=$(ls dist/*.AppImage 2>/dev/null | head -n 1 | xargs -n1 basename 2>/dev/null || true)
          TARBALL=$(ls dist/PCHome-desktop-*.tar.gz 2>/dev/null | head -n 1 | xargs -n1 basename 2>/dev/null || true)
          APK=$(ls dist/PCHome-mobile-*.apk 2>/dev/null | head -n 1 | xargs -n1 basename 2>/dev/null || true)
          BASE="https://github.com/${{ github.repository }}/releases/download/${VERSION}"
          {
            echo "{"
            echo "  \"version\": \"${VERSION}\","
            echo "  \"desktop_appimage\": \"${BASE}/${APPIMAGE}\","
            echo "  \"desktop_tarball\": \"${BASE}/${TARBALL}\","
            echo "  \"mobile_apk\": \"${BASE}/${APK}\""
            echo "}"
          } > dist/latest.json
          cat dist/latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: PCHome ${{ github.ref_name }}
          body_path: changelog.md
          files: dist/*
