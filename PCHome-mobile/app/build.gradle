plugins {
    id 'com.android.application'
}

// NOT: Sinyal adresi ARTIK gömülmüyor. Kullanıcı bağlantı ekranına
// adresi eliyle yazar (anonim); geçmiş adresler uygulamada saklanır.
// local.properties yalnız Android SDK yolunu (sdk.dir) içerir.

android {
    namespace 'com.PCHome.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.PCHome.mobile"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.3.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'io.github.webrtc-sdk:android:144.7559.12'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    // Yerel JVM testlerinde android.jar'daki org.json stub'ı çalışmaz;
    // gerçek gerçekleştirim test sınıf yoluna eklenir.
    testImplementation 'org.json:json:20231013'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
