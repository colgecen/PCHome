repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/pre-commit/rust
    rev: v1.0.0
    hooks:
      - id: fmt
        args: ['--all', '--', '--check']
      - id: clippy
        args: ['--all-targets', '--all-features', '--', '-D', 'warnings']
        pass_filenames: false

  - repo: https://github.com/golangci/golangci-precommit
    rev: v1.55.2
    hooks:
      - id: golangci-lint
        args: ['-c', 'pchome-signal/.golangci.yml', 'run', '--out-format=tab', '--issues-exit-code=1']
        pass_filenames: false

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
