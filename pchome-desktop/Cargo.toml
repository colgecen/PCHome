[workspace]
members = ["."]

[package]
name = "pchome-desktop"
version = "0.1.0"
edition = "2021"

[features]
default = ["capture", "webrtc", "gui"]
capture = []
webrtc = ["dep:webrtc"]
pipewire-rs = []
gui = ["dep:eframe", "dep:egui", "dep:image"]

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
rand = "0.8"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
chrono = "0.4"
parking_lot = "0.12"
serde_json = "1.0"
bytes = "1.0"
nix = { version = "0.29", features = ["ioctl"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
prometheus = "0.13"
lazy_static = "1.4"
thiserror = "1.0"
futures-util = "0.3"

# WebRTC peer connection + media (offerer, H.264 video track, control DataChannel)
webrtc = { version = "0.12", optional = true }
# Access to NetworkType for restricting ICE to IPv4 (avoids IPv6 link-local bind errors)
webrtc-ice = "0.12"
# Desktop GUI (header/panel/telemetry/terminate + live preview)
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }
# JPEG decode for the bundled window icon
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg"] }
# ffmpeg process control for HW encode pipeline
which = "6"

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pin_bench"
harness = false

[package.metadata.cargo-audit]
ignore = []

[package.metadata.audit]
ignore-config = "audit.toml"
