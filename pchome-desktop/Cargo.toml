[workspace]
members = ["."]

[package]
name = "pchome-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
rand = "0.8"
tokio-tungstenite = "0.21"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
chrono = "0.4"
parking_lot = "0.12"
serde_json = "1.0"
bytes = "1.0"
nix = { version = "0.29", features = ["ioctl"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
