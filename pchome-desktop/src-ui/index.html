<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PChome HUD</title>
  <link rel="stylesheet" href="styles/hud.css">
</head>
<body>
  <div id="hud" role="application" aria-label="PChome HUD" tabindex="0">
    <header id="hud-header">
      <h1 id="title">PChome</h1>
      <div id="connection-indicator" aria-live="polite">Disconnected</div>
    </header>
    <main id="hud-main">
      <section id="pin-section" aria-labelledby="pin-label">
        <label id="pin-label" for="pin">PIN</label>
        <div id="pin" aria-live="assertive">------</div>
      </section>
      <section id="status-section" aria-labelledby="status-label">
        <label id="status-label" for="status">Status</label>
        <div id="status">Idle</div>
      </section>
      <section id="error-section" hidden>
        <div id="error-message" role="alert"></div>
      </section>
    </main>
    <footer id="hud-footer">
      <kbd id="shortcut-hint">Ctrl+Shift+P</kbd>
    </footer>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
