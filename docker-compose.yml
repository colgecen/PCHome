version: "3.8"

services:
  signal:
    build:
      context: ./pchome-signal
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - signal-certs:/certs
    environment:
      - RATE_LIMIT=20
      - PIN_TTL=5m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  signal-certs:
