plugins {
    id 'com.android.application'
}

// Personal signal server URL lives in local.properties (gitignored) so every
// user keeps their own address out of the repository:
//     echo "signalUrl=wss://your-service.onrender.com/ws" >> local.properties
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def signalUrl = localProps.getProperty("signalUrl", "ws://localhost:8080/ws")

android {
    namespace 'com.pchome.mobile'
    compileSdk 34

    defaultConfig {
        applicationId "com.pchome.mobile"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SIGNAL_URL", "\"${signalUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'io.github.webrtc-sdk:android:144.7559.12'
    implementation 'org.java-websocket:Java-WebSocket:1.5.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:rules:1.5.0'
}
